<div id="v10full">
<style>
#v10full{font-family:Inter,system-ui,sans-serif;width:100%;color:#eef8ea}

#v10full .viewport{display:flex;justify-content:center;width:100%;min-height:0}
#v10full .device{--fg:#eef8ea;--mute:#a8bbaa;--edge:#ffffff20;--panel:#112018ea;--field:#ffffff09;position:relative;isolation:isolate;width:100%;height:auto;overflow:clip;color:var(--fg);background:#0b1610}
#v10full .device.light{--fg:#233a2a;--mute:#627a67;--edge:#33583a30;--panel:#fffffff0;--field:#ebf1e8}

#v10full .amb:before{left:-47%;top:-44%;background:radial-gradient(circle,#0f9f4b48,transparent 69%)}
#v10full .amb:after{right:-50%;bottom:-48%;background:radial-gradient(circle,#9c7b1c40,transparent 69%);animation-duration:28s;animation-delay:-9s}
#v10full .device:not(.light):not(.forest):not(.aurora) .amb:before,
#v10full .device:not(.light):not(.forest):not(.aurora) .amb:after{display:none}
@keyframes v10drift{to{transform:translate(18%,10%) scale(1.14)}}
#v10full .forest .amb{background:linear-gradient(125deg,#061b10,#164027,#081b10)}
#v10full .forest .amb:before{background:radial-gradient(circle,#52d87c75,transparent 69%)}
#v10full .aurora .amb{background:linear-gradient(125deg,#0b1624,#16303b,#151825)}
#v10full .aurora .amb:before{background:radial-gradient(circle,#24c3b063,transparent 69%)}
#v10full .aurora .amb:after{background:radial-gradient(circle,#777ad65b,transparent 69%)}
#v10full .light .amb{background:linear-gradient(125deg,#e9f3e7,#fcfcf8,#f4f0df)}
#v10full .light .amb:before{background:radial-gradient(circle,#a8e4b1a1,transparent 69%)}
#v10full .light .amb:after{background:radial-gradient(circle,#f0d88c9a,transparent 69%)}

#v10full .opening:not(.revealing) .screen{opacity:.025;filter:blur(9px);transform:scale(.965);pointer-events:none}
#v10full .opening.revealing .screen{opacity:1;filter:none;transform:none;pointer-events:none}

#v10full .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);align-items:center}
#v10full .visual{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0;padding:14px 12px}
#v10full .stage{width:100%;height:auto;position:relative;cursor:grab;touch-action:pan-y;flex:none}

#v10full .halo{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#addb7b6c,#61bd5927 41%,transparent 70%);filter:blur(24px);pointer-events:none}

#v10full .light .screen .brand-word{fill:#111d13}
#v10full .light .screen .brand-tag{fill:#777e77}
#v10full .login{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px 21px}
#v10full .card{width:100%;max-width:400px;padding:25px 24px;border-radius:21px;background:var(--panel);border:1px solid var(--edge);backdrop-filter:blur(18px);box-shadow:0 19px 52px #0003}
#v10full .eyebrow{font-size:10px;font-weight:800;letter-spacing:1.8px;color:var(--mute)}
#v10full h2{font-size:26px;letter-spacing:-.8px;line-height:1.15;margin:10px 0;font-weight:700}
#v10full .introline{font-size:12px;color:var(--mute);line-height:1.6;margin:0 0 20px}
#v10full .sep{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mute);margin:19px 0;white-space:nowrap}
#v10full .sep:before,#v10full .sep:after{content:"";height:1px;flex:1;background:var(--edge)}
#v10full .lbl{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
#v10full .fieldbox{position:relative;height:43px;margin-bottom:16px;border:1px solid var(--edge);border-radius:9px;background:var(--field);transition:border-color .2s,box-shadow .2s}
#v10full .fieldbox:hover{border-color:#87c88288}
#v10full .fieldbox:focus-within{border-color:#a9e88e;box-shadow:0 0 0 3px #a7de901d,0 0 15px #73d46d23}
#v10full .fieldbox input{position:relative;z-index:2;width:100%;height:100%;background:transparent;border:0;border-radius:9px;outline:0;padding:0 12px;color:var(--fg);font-size:12px}
#v10full .fieldbox.pass input{padding-right:65px}
#v10full .ghost{position:absolute;z-index:1;top:50%;left:12px;transform:translateY(-50%);color:var(--mute);font-size:12px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden}
#v10full .pass .ghost{max-width:calc(100% - 77px)}
#v10full .ghost.ready{background:linear-gradient(105deg,var(--mute) 7%,var(--mute) 30%,#c6edaa 45%,#fff5cb 50%,#c4eeaa 55%,var(--mute) 73%);background-size:270% 100%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:v10glint 8s linear infinite}
@keyframes v10glint{from{background-position:115% center}to{background-position:-115% center}}
#v10full .fieldbox:focus-within .ghost,#v10full .fieldbox.filled .ghost{visibility:hidden;opacity:0}
#v10full .fieldbox:after{content:"";position:absolute;bottom:-1px;left:-29%;width:28%;height:2px;opacity:0;background:linear-gradient(90deg,transparent,#d4ffb9,transparent)}
#v10full .fieldbox:focus-within:after{animation:v10trace .95s ease}
@keyframes v10trace{0%{left:-29%;opacity:0}20%{opacity:1}100%{left:103%;opacity:0}}
#v10full .showpass{position:absolute;z-index:4;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--mute);font-size:10px;padding:8px}
#v10full .extras{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;margin-bottom:19px}
#v10full .remember{display:flex;align-items:center;gap:6px;color:var(--mute)}
#v10full .remember input{accent-color:#8dd080}
#v10full .forgot{color:#b3e8aa;background:transparent;border:0;font-size:inherit;padding:0;white-space:nowrap}
#v10full .light .forgot{color:#277f40}
#v10full .submit{position:relative;isolation:isolate;overflow:hidden;width:100%;height:49px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #b7d69a80;border-radius:10px;background:linear-gradient(110deg,#337748,#56743a 50%,#8e6625);color:#f6fff2;font-weight:800;font-size:13px;box-shadow:0 8px 23px #0003,inset 0 1px #ffffff45;transition:transform .2s,box-shadow .2s}
#v10full .submit:before{content:"";position:absolute;left:-50%;top:-110%;bottom:-110%;width:38%;background:linear-gradient(90deg,transparent,#ffffff17,#ffffffb1,#ffffff22,transparent);transform:skewX(-24deg);animation:v10shine 6s ease-in-out infinite;pointer-events:none}
@keyframes v10shine{0%,12%{left:-50%}34%,100%{left:145%}}
#v10full .submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 29px #0005,0 7px 24px #88c26a54}
#v10full .submit:disabled{cursor:progress}
#v10full .submit.loading:before{animation:none}
#v10full .submit>span{position:relative;z-index:2}
#v10full .minisymbol{display:none;width:23px;height:23px;filter:drop-shadow(0 1px 2px #0006)}
#v10full .minisymbol svg{width:100%;height:100%;animation:v10spin 1.5s linear infinite}
@keyframes v10spin{to{transform:rotateY(360deg)}}
#v10full .submit.loading .minisymbol{display:block}
#v10full .submit.loading .arrow{display:none}
#v10full .feedback{font-size:10px;margin-top:10px;min-height:14px;text-align:center;line-height:1.4;color:#b6e4a6}
#v10full .light .feedback{color:#397d46}


#v10full .footer{display:none;text-align:center;color:var(--mute)}
#v10full .cinema{position:absolute;inset:0;z-index:20;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,#193221,#08120c 66%,#060a07)}
#v10full .cinema[hidden],#v10full .flight[hidden]{display:none!important}
#v10full .cinema:before{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:70%;height:70%;background:radial-gradient(ellipse,#51c96a45,transparent 70%);filter:blur(38px)}
#v10full .cinema.running{animation:v10curtain .9s linear both}
@keyframes v10curtain{0%,37%{opacity:1}57%{opacity:.9}83%{opacity:.2}100%{opacity:0}}
#v10full .filmload{position:absolute;bottom:49px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:#92ac96;opacity:.8}
#v10full .progress{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);width:125px;height:2px;border-radius:4px;overflow:hidden;background:#ffffff2b}
#v10full .progress i{height:100%;width:100%;display:block;background:linear-gradient(90deg,#16cf78,#f2c536);transform-origin:left;transform:scaleX(0)}
#v10full .cinema.running .progress i{animation:v10progress .9s linear both}
@keyframes v10progress{to{transform:scaleX(1)}}
#v10full .skip{position:absolute;z-index:35;top:13px;right:13px;border:1px solid #9bb79168;background:#ffffff12;border-radius:25px;padding:8px 12px;color:#d5e7d4;font-size:10px;pointer-events:auto}
#v10full .flight{position:absolute;z-index:24;pointer-events:none;transform-origin:center center;will-change:transform,filter,opacity}
#v10full .flight-logo{overflow:visible}
#v10full .flight-logo .halo{width:75%;height:83%;background:radial-gradient(circle,#c6e67b6d,#6ddc653d 40%,transparent 72%);filter:blur(26px)}
#v10full .flight-words .brandlockup{height:100%;padding-bottom:12px}
#v10full .flight-words .brand-word{fill:#e8efe7}
#v10full .flight-words .brand-tag{fill:#aeb6ad}
#v10full .flight-logo.running{animation:v10travel .9s cubic-bezier(.17,.65,.22,1) both}
#v10full .flight-words.running{animation:v10wordstravel .9s cubic-bezier(.17,.65,.22,1) both}
@keyframes v10travel{
0%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc));filter:blur(15px) brightness(1.4)}
17%{opacity:1;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc));filter:blur(0) brightness(1.22) drop-shadow(0 0 19px #b4ef8c88)}
42%{opacity:1;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc));filter:brightness(1.08) drop-shadow(0 0 14px #9ce87e75)}
75%{opacity:1;filter:brightness(1.04) drop-shadow(0 0 8px #b7f8a855)}
100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:none}
}
@keyframes v10wordstravel{
0%,17%{opacity:0;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc));filter:blur(7px)}
30%{opacity:1;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc));filter:blur(0)}
42%{opacity:1;transform:translate3d(var(--dx),var(--dy),0) scale(var(--sc))}
100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:none}
}
@media(prefers-reduced-motion:reduce){
#v10full .amb:before,#v10full .amb:after,#v10full .ghost.ready,#v10full .submit:before{animation:none}
}
/* V18: the scene fills its browsing context; content defines the minimum height. */

 #v10full .introline{font-size:clamp(.5625rem,2.8vw,.6875rem);margin:0 0 12px}
 #v10full .sep{font-size:10px;margin:clamp(9px,1.8dvh,16px) 0}

  let bgX=0,bgY=0,darkX=0,darkY=0,bgEnergy=0,varnishX=0,varnishY=0;
  const random=(min,max)=>min+Math.random()*(max-min);
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const shuffle=array=>{
    for(let i=array.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [array[i],array[j]]=[array[j],array[i]];
    }
  };

  function palette(){
    if(device.classList.contains('light')){
      return {line:'47,104,59',node:'42,95,54',glow:'48,145,72'};
    }
    if(device.classList.contains('aurora')){
      return {line:'113,190,192',node:'153,224,217',glow:'66,205,194'};
    }
    if(device.classList.contains('forest')){
      return {line:'116,211,143',node:'166,237,174',glow:'81,216,123'};

        const dx=point.x-impulse.x,dy=point.y-impulse.y;
        const distance=Math.hypot(dx,dy)||1;
        const influence=Math.exp(-distance*distance/(2*impulse.radius*impulse.radius));
        const force=impulse.strength*Math.sin(Math.PI*age)*influence;
        point.ax+=dx/distance*force;
        point.ay+=dy/distance*force;
      }
    }

    for(const edge of edges){
      const a=points[edge.a],b=points[edge.b];
      const dx=b.x-a.x,dy=b.y-a.y;
      const distance=Math.hypot(dx,dy)||.001;
      const force=(distance-edge.restLength)*8.5;
      const fx=dx/distance*force,fy=dy/distance*force;
      a.ax+=fx;a.ay+=fy;
      b.ax-=fx;b.ay-=fy;
    }

    for(const point of points){
      point.vx=clamp((point.vx+point.ax*dt)*damping,-190,190);
      point.vy=clamp((point.vy+point.ay*dt)*damping,-190,190);
      point.x+=point.vx*dt;
      point.y+=point.vy*dt;

      const dx=point.x-point.baseX,dy=point.y-point.baseY;
      const distance=Math.hypot(dx,dy);
      if(distance>6.5){
        const scale=6.5/distance;
        point.x=point.baseX+dx*scale;
        point.y=point.baseY+dy*scale;
        point.vx*=.48;point.vy*=.48;
      }
      point.x=clamp(point.x,1,width-1);
      point.y=clamp(point.y,1,height-1);
    }

    impulses=impulses.filter(impulse=>(now-impulse.start)<impulse.duration);
    mouse.vx*=.82;mouse.vy*=.82;
  }

  function pointOnEdge(edge,progress){
    const a=points[edge.a],b=points[edge.b];
    return {x:a.x+(b.x-a.x)*progress,y:a.y+(b.y-a.y)*progress};
  }

  function updateBackground(now){
    const time=now*.001;
    const px=mouse.active?mouse.x/width-.5:0;
    const py=mouse.active?mouse.y/height-.5:0;
    const driftX=Math.sin(time*.20)*3.4;
    const driftY=Math.cos(time*.16)*2.6;
    const targetX=driftX-px*11;
    const targetY=driftY-py*8;
    const targetDarkX=-driftX*.75+px*7;
    const targetDarkY=-driftY*.75+py*5;

    bgX+=(targetX-bgX)*.045;
    bgY+=(targetY-bgY)*.045;
    darkX+=(targetDarkX-darkX)*.04;
    darkY+=(targetDarkY-darkY)*.04;

    const speed=Math.min(1,Math.hypot(mouse.vx,mouse.vy)/800);
    bgEnergy+=(speed-bgEnergy)*.07;
    varnishX+=(targetDarkX*.34-varnishX)*.035;
    varnishY+=(targetDarkY*.34-varnishY)*.035;

    if(greenLayer){
      greenLayer.style.transform=`translate3d(${bgX}px,${bgY}px,0) scale(1.04)`;
      greenLayer.style.opacity=String(.72+bgEnergy*.13+(mouse.active?.06:0));
      greenLayer.style.filter=`saturate(${1.04+bgEnergy*.12}) brightness(${1+bgEnergy*.035})`;
    }
    if(darkLayer){
      darkLayer.style.transform=`translate3d(${darkX}px,${darkY}px,0) scale(1.04)`;
      darkLayer.style.opacity=String(.82+bgEnergy*.08);
    }
    if(varnish){
      varnish.style.transform=`translate3d(${varnishX}px,${varnishY}px,0) scale(1.04)`;
      varnish.style.opacity=String(.72+bgEnergy*.035);
    }
  }

  function draw(now){
    raf=0;
    if(!visible)return;
    const dt=lastTime?Math.min((now-lastTime)/1000,.025):1/60;
    lastTime=now;
    ctx.clearRect(0,0,width,height);
    mouse.x+=(mouse.targetX-mouse.x)*.16;
    mouse.y+=(mouse.targetY-mouse.y)*.16;
    updateBackground(now);
    physics(now,dt);

    const colors=palette();
    const active=mouse.active&&!reduced;
    const time=now*.001;

    for(const edge of edges){
      const a=points[edge.a],b=points[edge.b];
      const midX=(a.x+b.x)/2,midY=(a.y+b.y)/2;
      const distance=active?Math.hypot(midX-mouse.x,midY-mouse.y):9999;
      const influence=active?Math.pow(Math.max(0,1-distance/190),2):0;
      const breathe=.5+.5*Math.sin(time*1.7+edge.phase);
      const base=device.classList.contains('light')?.055:(edge.type===1?.064:.083);
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(${colors.line},${base+breathe*.018+influence*.21})`;
      ctx.lineWidth=.55+influence*.35;
      ctx.stroke();
    }

    highlights=highlights.filter(item=>{
      const age=now-item.born;
      if(age>item.duration)return false;
      const a=points[item.edge.a],b=points[item.edge.b];
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(163,224,169,${Math.sin(Math.PI*age/item.duration)*.32})`;
      ctx.lineWidth=.95;
      ctx.stroke();
      return true;
    });

    if(!reduced&&now>nextScan){
      const edge=edges[Math.floor(Math.random()*edges.length)];
      if(edge)scans.push({edge,start:now,duration:1250,reverse:Math.random()>.5});
      if(scans.length>2)scans.shift();
      nextScan=now+random(2300,3600);
    }

    scans=scans.filter(scan=>{
      const progress=(now-scan.start)/scan.duration;
      if(progress>=1)return false;
      const position=scan.reverse?1-progress:progress;
      const a=pointOnEdge(scan.edge,clamp(position-.09,0,1));
      const b=pointOnEdge(scan.edge,clamp(position+.09,0,1));
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);
      ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(187,241,190,${Math.sin(progress*Math.PI)*.40})`;
      ctx.lineWidth=1.15;
      ctx.stroke();
      return true;
    });

    for(const point of points){
      const distance=active?Math.hypot(point.x-mouse.x,point.y-mouse.y):9999;
      const influence=active?Math.pow(Math.max(0,1-distance/175),2):0;
      const breathe=.5+.5*Math.sin(time*1.8+point.phase);
      ctx.beginPath();
      ctx.arc(point.x,point.y,point.size+influence*.55,0,Math.PI*2);
      ctx.fillStyle=`rgba(${colors.node},${.19+breathe*.13+influence*.31})`;
      ctx.fill();
      if(influence>.15){
        ctx.beginPath();
        ctx.arc(point.x,point.y,2+influence*1.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(${colors.glow},${influence*.13})`;
        ctx.fill();
      }
    }

    if(active&&now-lastMousePulse>580){
      const moved=Math.hypot(mouse.x-lastMouseX,mouse.y-lastMouseY);
      if(moved>7){
        let closest=-1,distance=88;
        points.forEach((point,index)=>{
          const d=Math.hypot(point.x-mouse.x,point.y-mouse.y);
          if(d<distance){distance=d;closest=index;}
        });
        if(closest>=0){
          pulseFrom(closest,now,.95);
          lastMousePulse=now;
          lastMouseX=mouse.x;
          lastMouseY=mouse.y;
        }
      }
    }

    if(!reduced&&now>nextAmbient){
      const index=Math.floor(Math.random()*points.length);
      const point=points[index];
      applyImpulse(point.x,point.y,now,random(750,1050));
      pulseFrom(index,now,.65);
      const adjacent=edges.filter(edge=>edge.a===index||edge.b===index);
      if(adjacent.length){
        highlights.push({edge:adjacent[Math.floor(Math.random()*adjacent.length)],born:now,duration:1100});
      }
      nextAmbient=now+random(2400,3900);
    }

    if(!reduced){
      pulses=pulses.filter(pulse=>{
        const progress=(now-pulse.start)/pulse.duration;
        if(progress<0)return true;
        if(progress>=1)return false;
        const eased=progress*progress*(3-2*progress);
        const position=pulse.from===pulse.edge.a?eased:1-eased;
        const point=pointOnEdge(pulse.edge,position);
        ctx.beginPath();
        ctx.arc(point.x,point.y,1.2,0,Math.PI*2);
        ctx.fillStyle=`rgba(190,244,193,${Math.sin(progress*Math.PI)*.58*pulse.intensity})`;
        ctx.fill();
        return true;
      });
    }

    if(!reduced)raf=requestAnimationFrame(draw);
  }

  function start(){
    if(!visible)return;
    if(reduced){draw(performance.now());return;}
    if(!raf)raf=requestAnimationFrame(draw);
  }
  function stop(){
    if(raf)cancelAnimationFrame(raf);
    raf=0;
    lastTime=0;
  }

  device.addEventListener('pointermove',event=>{
    const rect=device.getBoundingClientRect();
    const x=event.clientX-rect.left,y=event.clientY-rect.top;
    const now=performance.now();
    const elapsed=Math.max(.008,(now-(mouse.lastTime||now-16))/1000);
    mouse.vx=clamp((x-mouse.targetX)/elapsed,-700,700);
    mouse.vy=clamp((y-mouse.targetY)/elapsed,-700,700);
    mouse.targetX=x;mouse.targetY=y;mouse.lastTime=now;mouse.active=true;
    if(reduced)start();
  },{passive:true});

  device.addEventListener('pointerleave',()=>{
    mouse.active=false;
    mouse.targetX=-1000;mouse.targetY=-1000;
    mouse.vx=0;mouse.vy=0;
    if(reduced)start();
  },{passive:true});

  device.addEventListener('pointerdown',event=>{
    const rect=device.getBoundingClientRect();
    const x=event.clientX-rect.left,y=event.clientY-rect.top;
    mouse.targetX=x;mouse.targetY=y;mouse.active=true;
    if(!reduced){
      applyImpulse(x,y,performance.now(),1400);
      let closest=-1,distance=125;
      points.forEach((point,index)=>{
        const d=Math.hypot(point.x-x,point.y-y);
        if(d<distance){distance=d;closest=index;}
      });
      if(closest>=0)pulseFrom(closest,performance.now(),1.1);
    }
    start();
  },{passive:true});

  device.addEventListener('pointerup',event=>{
    if(event.pointerType==='touch'||event.pointerType==='pen'){
      mouse.active=false;
      mouse.targetX=-1000;mouse.targetY=-1000;
    }
  },{passive:true});

  document.addEventListener('visibilitychange',()=>{
    visible=!document.hidden;
    if(visible)start();else stop();
  });

  motion.addEventListener?.('change',event=>{
    reduced=event.matches;
    if(reduced)stop();
    start();
  });

  if(window.ResizeObserver){
    new ResizeObserver(()=>{resize();start();}).observe(device);
  }else{
    window.addEventListener('resize',()=>{resize();start();},{passive:true});
  }

  new MutationObserver(()=>{if(reduced)start();})
    .observe(device,{attributes:true,attributeFilter:['class']});

  resize();
  start();
})();
</script>

<script type="module" src="./i18n.js"></script>
<script id="vx-global-tooltip-engine">
(function(){
  'use strict';

  // One tooltip node and one pointer-driven controller per page.
  const TOOLTIP_ID='vx-global-tooltip';
  if(window.__vxGlobalTooltipManager){
    const nodes=[...document.querySelectorAll('#'+TOOLTIP_ID+',.vx-global-tooltip')];
    nodes.slice(1).forEach(node=>node.remove());
    return;
  }
  window.__vxGlobalTooltipManager=true;

  const SHOW_DELAY=70;
  const allExisting=[...document.querySelectorAll('#'+TOOLTIP_ID+',.vx-global-tooltip')];
  const tooltip=allExisting.shift()||document.createElement('div');
  allExisting.forEach(node=>node.remove());
  tooltip.id=TOOLTIP_ID;
  tooltip.className='vx-global-tooltip';
  tooltip.textContent='';
  tooltip.setAttribute('role','tooltip');
  tooltip.setAttribute('aria-hidden','true');
  tooltip.style.pointerEvents='none';
  if(tooltip.parentElement!==document.body)document.body.appendChild(tooltip);

  let active=null;
  let pending=null;
  let showTimer=0;
  let pointerEpoch=0;
  let pointer={x:-1,y:-1,inside:false};

  const textFor=el=>(el?.getAttribute('data-tooltip')||'').trim();
  const targetFor=node=>node instanceof Element?node.closest('[data-tooltip]'):null;

  function migrateTitle(el){
    if(!el||el.nodeType!==1||!el.hasAttribute('title'))return;
    const nativeTitle=el.getAttribute('title');
    if(nativeTitle&&!el.hasAttribute('data-tooltip'))el.setAttribute('data-tooltip',nativeTitle);
    el.removeAttribute('title');
  }

  function usable(el){
    if(!el||!el.isConnected||!textFor(el))return false;
    if(el.matches(':disabled,[aria-disabled="true"]'))return false;
    if(!el.getClientRects().length||el.closest('[hidden],[inert],[aria-hidden="true"]'))return false;
    if(el.matches('#sidebar .nav-item')&&!document.body.classList.contains('collapsed'))return false;
    return true;
  }

  function targetAt(x,y){
    if(x<0||y<0||x>=window.innerWidth||y>=window.innerHeight)return null;
    const under=document.elementFromPoint(x,y);
    if(!under)return null;
    const titled=under.closest?.('[title]');
    if(titled)migrateTitle(titled);
    const el=targetFor(under);
    return usable(el)?el:null;
  }

  function addDescription(el){
    const ids=(el.getAttribute('aria-describedby')||'').split(/\s+/).filter(Boolean);
    if(!ids.includes(TOOLTIP_ID))ids.push(TOOLTIP_ID);
    el.setAttribute('aria-describedby',ids.join(' '));
  }

  function removeDescription(el){
    if(!el)return;
    const ids=(el.getAttribute('aria-describedby')||'').split(/\s+/).filter(id=>id&&id!==TOOLTIP_ID);
    if(ids.length)el.setAttribute('aria-describedby',ids.join(' '));
    else el.removeAttribute('aria-describedby');
  }

  function hide(){
    clearTimeout(showTimer);
    pending=null;
    if(active)removeDescription(active);
    active=null;
    tooltip.classList.remove('is-visible');
    tooltip.setAttribute('aria-hidden','true');
  }

  function place(el){
    tooltip.style.left='0px';
    tooltip.style.top='0px';
    tooltip.classList.add('is-visible');
    tooltip.setAttribute('aria-hidden','false');
    const anchor=el.getBoundingClientRect();
    const box=tooltip.getBoundingClientRect();
    let x,y;
    if(el.matches('#sidebar .nav-item')){
      x=anchor.right+9;
      y=anchor.top+(anchor.height-box.height)/2;
      if(x+box.width>window.innerWidth-8)x=anchor.left-box.width-9;
    }else{
      x=anchor.left+(anchor.width-box.width)/2;
      y=anchor.top-box.height-8;
      if(y<8)y=anchor.bottom+8;
    }
    x=Math.max(8,Math.min(x,window.innerWidth-box.width-8));
    y=Math.max(8,Math.min(y,window.innerHeight-box.height-8));
    tooltip.style.left=Math.round(x)+'px';
    tooltip.style.top=Math.round(y)+'px';
  }

  function show(el){
    if(!pointer.inside||!usable(el)||targetAt(pointer.x,pointer.y)!==el){hide();return;}
    if(active&&active!==el)removeDescription(active);
    active=el;
    tooltip.textContent=textFor(el);
    addDescription(el);
    place(el);
  }

  function setTarget(next){
    if(next===active)return;
    if(next!==null&&next===pending)return;
    clearTimeout(showTimer);
    pending=null;
    if(active)hide();
    if(!next)return;
    pending=next;
    showTimer=setTimeout(()=>{
      if(pending!==next)return;
      if(!pointer.inside||targetAt(pointer.x,pointer.y)!==next){hide();return;}
      pending=null;
      show(next);
    },SHOW_DELAY);
  }

  function updatePointer(x,y,pointerType){
    if(pointerType==='touch'){
      clearPointer();
      return;
    }
    pointer.x=x;
    pointer.y=y;
    pointer.inside=x>=0&&y>=0&&x<window.innerWidth&&y<window.innerHeight;
    setTarget(pointer.inside?targetAt(x,y):null);
  }

  // Leaving the page can report the cursor's last in-page coordinates.
  // Invalidate those coordinates and any queued pointerout frame immediately.
  function clearPointer(){
    pointerEpoch++;
    pointer.x=-1;
    pointer.y=-1;
    pointer.inside=false;
    hide();
  }

  // Tooltips are triggered only by a real mouse/pen pointer over the exact target.
  // Keyboard focus and clicks never create a tooltip on their own.
  document.addEventListener('pointerover',event=>{
    if(event.pointerType==='touch')return;
    updatePointer(event.clientX,event.clientY,event.pointerType);
  },true);

  document.addEventListener('pointermove',event=>{
    if(event.pointerType==='touch')return;
    updatePointer(event.clientX,event.clientY,event.pointerType);
  },{capture:true,passive:true});

  document.addEventListener('pointerout',event=>{
    if(event.pointerType==='touch')return;

    // A null relatedTarget means the pointer left the browsing surface.
    // Do not re-check the last coordinates: they may still be inside the old button.
    if(event.relatedTarget===null){
      clearPointer();
      return;
    }

    pointer.x=event.clientX;
    pointer.y=event.clientY;
    const epoch=pointerEpoch;
    requestAnimationFrame(()=>{
      if(epoch!==pointerEpoch||!pointer.inside)return;
      updatePointer(pointer.x,pointer.y,event.pointerType);
    });
  },true);

  // Extra exit signals cover browser chrome, iframe boundaries and tab changes.
  window.addEventListener('pointerleave',clearPointer);
  document.addEventListener('mouseleave',clearPointer);
  window.addEventListener('mouseout',event=>{
    if(event.relatedTarget===null)clearPointer();
  },true);

  document.addEventListener('pointercancel',clearPointer,true);
  window.addEventListener('blur',clearPointer);
  window.addEventListener('pagehide',clearPointer);
  window.addEventListener('resize',hide,{passive:true});
  document.addEventListener('scroll',hide,true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)clearPointer();});

  // Remove browser-native title balloons and keep dynamic content on the same system.
  document.querySelectorAll('[title]').forEach(migrateTitle);
  const observer=new MutationObserver(records=>{
    for(const record of records){
      if(record.type==='attributes'){
        if(record.attributeName==='title')migrateTitle(record.target);
        if(record.attributeName==='data-tooltip'&&record.target===active){
          if(textFor(active)){tooltip.textContent=textFor(active);place(active);}
          else hide();
        }
      }else{
        for(const node of record.addedNodes){
          if(node.nodeType!==1)continue;
          migrateTitle(node);
          node.querySelectorAll?.('[title]').forEach(migrateTitle);
        }
      }
    }

    // If a render replaces the hovered control, re-check the exact pointer position.
    if(active&&!active.isConnected)hide();
    if(pending&&!pending.isConnected)hide();
    const nodes=[...document.querySelectorAll('#'+TOOLTIP_ID+',.vx-global-tooltip')];
    nodes.filter(node=>node!==tooltip).forEach(node=>node.remove());
    if(!tooltip.isConnected)document.body.appendChild(tooltip);
    if(pointer.inside)setTarget(targetAt(pointer.x,pointer.y));
  });
  observer.observe(document.documentElement,{
    subtree:true,childList:true,attributes:true,
    attributeFilter:['title','data-tooltip']
  });
})();
</script>
